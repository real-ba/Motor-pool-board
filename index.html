<body>
  <h1>Motor Pool Board</h1>

  <input id="name" placeholder="Equipment name">
  <button onclick="addItem()">Add</button>

  <div id="board"></div>

<script>
let items = JSON.parse(localStorage.getItem("items") || "[]");

function render() {
  document.getElementById("board").innerHTML =
    items.map((i, idx) => `
      <div>
        ${i.name} - ${i.status}
        <button onclick="toggle(${idx})">Toggle</button>
      </div>
    `).join("");

  localStorage.setItem("items", JSON.stringify(items));
}

function addItem() {
  const name = document.getElementById("name").value;
  items.push({name, status: "FMC"});
  render();
}

function toggle(i) {
  items[i].status = items[i].status === "FMC" ? "PM" : "FMC";
  render();
}

render();
</script>
</body>
